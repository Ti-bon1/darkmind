[package]
name = "darkmind"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
printpdf = "0.12"
epaint_default_fonts = "0.36"
rfd = { version = "0.17", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
